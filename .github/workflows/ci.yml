name: Tests et compilation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le moteur sur des fichiers fictifs
        run: swift run --build-system native ClairChecks
      - name: Compiler et vérifier la signature locale
        run: zsh scripts/build.sh
